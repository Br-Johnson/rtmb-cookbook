<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 124" width="800" height="124" role="img" aria-labelledby="workflow-title workflow-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="workflow-title">The nine-step workflow</title>
  <desc id="workflow-desc">Nine numbered boxes in a row joined by arrows: 1 data, 2 model, 3 fit, 4 check the fit, 5 estimates, 6 check the model, 7 random effect, 8 compare, 9 forecast.</desc>
  <defs>
    <marker id="workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="124" fill="#ffffff"/>
  <g stroke="#333333" stroke-width="2" fill="#f2f2f2">
    <rect x="3" y="16" width="74" height="92" rx="8"/>
    <rect x="93" y="16" width="74" height="92" rx="8"/>
    <rect x="183" y="16" width="74" height="92" rx="8"/>
    <rect x="273" y="16" width="74" height="92" rx="8"/>
    <rect x="363" y="16" width="74" height="92" rx="8"/>
    <rect x="453" y="16" width="74" height="92" rx="8"/>
    <rect x="543" y="16" width="74" height="92" rx="8"/>
    <rect x="633" y="16" width="74" height="92" rx="8"/>
    <rect x="723" y="16" width="74" height="92" rx="8"/>
  </g>
  <g stroke="#333333" stroke-width="2.5" marker-end="url(#workflow-arrow)">
    <line x1="79" y1="62" x2="91" y2="62"/>
    <line x1="169" y1="62" x2="181" y2="62"/>
    <line x1="259" y1="62" x2="271" y2="62"/>
    <line x1="349" y1="62" x2="361" y2="62"/>
    <line x1="439" y1="62" x2="451" y2="62"/>
    <line x1="529" y1="62" x2="541" y2="62"/>
    <line x1="619" y1="62" x2="631" y2="62"/>
    <line x1="709" y1="62" x2="721" y2="62"/>
  </g>
  <g fill="#000000" text-anchor="middle" font-size="22" font-weight="bold">
    <text x="40" y="48">1</text>
    <text x="130" y="48">2</text>
    <text x="220" y="48">3</text>
    <text x="310" y="48">4</text>
    <text x="400" y="48">5</text>
    <text x="490" y="48">6</text>
    <text x="580" y="48">7</text>
    <text x="670" y="48">8</text>
    <text x="760" y="48">9</text>
  </g>
  <g fill="#000000" text-anchor="middle" font-size="15">
    <text x="40" y="76">data</text>
    <text x="130" y="76">model</text>
    <text x="220" y="76">fit</text>
    <text x="310" y="74">check</text>
    <text x="310" y="93">the fit</text>
    <text x="400" y="76">estimates</text>
    <text x="490" y="74">check</text>
    <text x="490" y="93">the model</text>
    <text x="580" y="74">random</text>
    <text x="580" y="93">effect</text>
    <text x="670" y="76">compare</text>
    <text x="760" y="76">forecast</text>
  </g>
</svg>
